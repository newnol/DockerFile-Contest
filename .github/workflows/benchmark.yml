name: Python contest comparison

on:
  push:
    branches: [ci/python-contest-comparison]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Measure ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        variant: [default, top1, top2, top-entry3]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Measure cold, warm, source change and runtime
        run: python3 benchmarks/measure.py '${{ matrix.variant }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: benchmark-${{ matrix.variant }}
          path: results/
          if-no-files-found: error
          retention-days: 30
  compare:
    name: Compare all four recipes
    if: always()
    needs: benchmark
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: benchmark-*
          path: collected
      - name: Build comparison table
        run: python3 benchmarks/measure.py summary collected
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: comparison
          path: |
            collected/comparison.md
            collected/comparison.json
          if-no-files-found: error
          retention-days: 30
