<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title4 desc4"><title id="title4">Xóa ở lớp sau không làm lớp trước nhỏ lại</title><desc id="desc4">So sánh dữ liệu được giữ lại trong image, không chỉ cây tệp cuối cùng.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#145EA8"/></marker></defs><g font-family="Segoe UI, Arial, sans-serif"><rect width="1600" height="900" fill="white"/><text x="64" y="92" font-size="46" fill="#142D43" font-weight="700">Xóa ở lớp sau không làm lớp trước nhỏ lại</text><text x="64" y="139" font-size="25" fill="#455D70" font-weight="400">So sánh dữ liệu được giữ lại trong image, không chỉ cây tệp cuối cùng.</text><path d="M64 171 L1536 171" stroke="#CBD8E3" stroke-width="2"/><text x="64" y="230" font-size="31" fill="#A42D40" font-weight="700">Xóa ở RUN sau</text><text x="845" y="230" font-size="31" fill="#096B60" font-weight="700">Tạo và xóa trong cùng RUN</text><path d="M800 218 L800 671" stroke="#CBD8E3" stroke-width="2"/><rect x="64" y="259" width="690" height="110" rx="10" fill="#F5F8FB" stroke="#B3C6D5" stroke-width="2"/><text x="86" y="300" font-size="25" fill="#142D43" font-weight="400" font-family="Consolas, monospace">RUN tạo /tmp/cache.bin</text><text x="86" y="341" font-size="25" fill="#142D43" font-weight="400" font-family="Consolas, monospace">RUN rm /tmp/cache.bin</text><rect x="64" y="398" width="690" height="84" rx="10" fill="#FBECEF" stroke="#CB8F99" stroke-width="2"/><text x="88" y="433" font-size="26" fill="#A42D40" font-weight="700">Lớp sau: whiteout / dấu xóa</text><text x="88" y="466" font-size="23" fill="#142D43" font-weight="400">Merged view không còn thấy tệp</text><rect x="64" y="511" width="690" height="84" rx="10" fill="#EAF2FA" stroke="#9BB4CA" stroke-width="2"/><text x="88" y="547" font-size="26" fill="#145EA8" font-weight="700">Lớp trước: cache.bin vẫn còn</text><text x="88" y="580" font-size="23" fill="#142D43" font-weight="400">Dữ liệu cũ vẫn chiếm dung lượng image</text><text x="64" y="650" font-size="27" fill="#A42D40" font-weight="700">Ẩn tệp ≠ thu hồi dữ liệu ở lớp dưới</text><rect x="845" y="259" width="690" height="110" rx="10" fill="#F5F8FB" stroke="#B3C6D5" stroke-width="2"/><text x="867" y="300" font-size="25" fill="#142D43" font-weight="400" font-family="Consolas, monospace">RUN tạo /tmp/cache.bin &amp;&amp;</text><text x="867" y="341" font-size="25" fill="#142D43" font-weight="400" font-family="Consolas, monospace">    rm /tmp/cache.bin</text><rect x="845" y="398" width="690" height="197" rx="10" fill="#E0F3EF" stroke="#71A99E" stroke-width="2"/><text x="869" y="441" font-size="28" fill="#096B60" font-weight="700">Kết thúc RUN: tệp không còn</text><text x="869" y="491" font-size="25" fill="#142D43" font-weight="400">Không lưu nội dung tệp tạm này</text><text x="869" y="529" font-size="25" fill="#142D43" font-weight="400">trong thay đổi cuối của lớp.</text><text x="869" y="572" font-size="23" fill="#455D70" font-weight="400">Điều kiện: tệp được tạo trong RUN này.</text><text x="845" y="650" font-size="27" fill="#096B60" font-weight="700">Dọn tệp tạm trước khi kết thúc RUN</text><rect x="64" y="706" width="1472" height="96" rx="10" fill="#F0F5F9" stroke="#D2DEE7" stroke-width="2"/><text x="88" y="745" font-size="25" fill="#142D43" font-weight="600">Xóa tệp vốn có ở lớp dưới, dù trong cùng RUN, vẫn không xóa dữ liệu lớp dưới.</text><text x="88" y="780" font-size="23" fill="#455D70" font-weight="400">Whiteout chỉ che tệp; ví dụ là mã giả. Không tính kích thước nén hay cache build.</text><text x="64" y="847" font-size="19" fill="#455D70" font-weight="400">Nguồn: Docker Docs · storage/drivers/ và storage/drivers/overlayfs-driver/</text><text x="1458" y="847" font-size="22" fill="#455D70" font-weight="400">4 / 4</text></g></svg>