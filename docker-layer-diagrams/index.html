tton id="print" type="button">In / lưu PDF</button></nav><main><figure id="diagram-1"><div class="canvas"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title1 desc1"><title id="title1">Dockerfile tạo nên image layers</title><desc id="desc1">Mô hình giản lược: các thay đổi hệ thống tệp được xếp thành lớp.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#145EA8"/></marker></defs><g font-family="Segoe UI, Arial, sans-serif"><rect width="1600" height="900" fill="white"/><text x="64" y="92" font-size="46" fill="#142D43" font-weight="700">Dockerfile tạo nên image layers</text><text x="64" y="139" font-size="25" fill="#455D70" font-weight="400">Mô hình giản lược: các thay đổi hệ thống tệp được xếp thành lớp.</text><path d="M64 171 L1536 171" stroke="#CBD8E3" stroke-width="2"/><text x="80" y="228" font-size="29" fill="#142D43" font-weight="700">Dockerfile minh họa</text><text x="910" y="228" font-size="29" fill="#142D43" font-weight="700">Image: chồng các lớp chỉ đọc</text><rect x="80" y="260" width="660" height="388" rx="10" fill="#F5F8FB" stroke="#B3C6D5" stroke-width="2"/><text x="108" y="320" font-size="25" fill="#142D43" font-weight="400" font-family="Consolas, monospace">FROM alpine:3.21</text><text x="108" y="390" font-size="25" fill="#142D43" font-weight="400" font-family="Consolas, monospace">COPY app/ /app/</text><text x="108" y="460" font-size="25" fill="#142D43" font-weight="400" font-family="Consolas, monospace">RUN chmod +x /app/start.sh</text><text x="108" y="530" font-size="25" fill="#142D43" font-weight="400" font-family="Consolas, monospace">CMD [&quot;/app/start.sh&quot;]</text><text x="108" y="600" font-size="23" fill="#455D70" font-weight="400">CMD: cấu hình chạy, không thêm lớp tệp</text><rect x="910" y="280" width="610" height="94" rx="10" fill="#EAF2FA" stroke="#9BB4CA" stroke-width="2"/><text x="936" y="317" font-size="28" fill="#145EA8" font-weight="700">Lớp mới: RUN</text><text x="936" y="352" font-size="23" fill="#142D43" font-weight="400">Đổi quyền /app/start.sh</text><rect x="910" y="390" width="610" height="94" rx="10" fill="#EAF2FA" stroke="#9BB4CA" stroke-width="2"/><text x="936" y="427" font-size="28" fill="#145EA8" font-weight="700">Lớp mới: COPY</text><text x="936" y="462" font-size="23" fill="#142D43" font-weight="400">Thêm nội dung /app/</text><rect x="910" y="500" width="610" height="94" rx="10" fill="#EAF2FA" stroke="#9BB4CA" stroke-width="2"/><text x="936" y="537" font-size="28" fill="#145EA8" font-weight="700">Các lớp từ base image</text><text x="936" y="572" font-size="23" fill="#142D43" font-weight="400">FROM tham chiếu image nền</text><path d="M755 406 L887 406" fill="none" stroke="#145EA8" stroke-width="3" marker-end="url(#arrow)"/><text x="775" y="382" font-size="23" fill="#145EA8" font-weight="600">build</text><text x="930" y="634" font-size="24" fill="#455D70" font-weight="400">Đọc chồng từ dưới lên</text><rect x="64" y="706" width="1472" height="96" rx="10" fill="#F0F5F9" stroke="#D2DEE7" stroke-width="2"/><text x="88" y="745" font-size="25" fill="#142D43" font-weight="600">RUN, COPY, ADD có thể tạo thay đổi hệ thống tệp.</text><text x="88" y="780" font-size="23" fill="#455D70" font-weight="400">Không phải mọi lệnh Dockerfile đều tạo filesystem layer; FROM dùng các lớp có sẵn.</text><text x="64" y="847" font-size="19" fill="#455D70" font-weight="400">Nguồn: docs.docker.com/engine/storage/drivers/</text><text x="1458" y="847" font-size="22" fill="#455D70" font-weight="400">1 / 4</text></g></svg></div><figcaption><a href="#diagram-1" data-show="1">Chỉ hiện hình 1</a> · <a href="https://docs.docker.com/engine/storage/drivers/">Storage drivers</a> · <a href="https://docs.docker.com/engine/storage/drivers/overlayfs-driver/">OverlayFS driver</a></figcaption></figure><figure id="diagram-2"><div class="canvas"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title2 desc2"><title id="title2">Image chỉ đọc, container có lớp ghi</title><desc id="desc2">Merged view là góc nhìn hợp nhất, không phải một bản sao đầy đủ của image.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#145EA8"/></marker></defs><g font-family="Segoe UI, Arial, sans-serif"><rect width="1600" height="900" fill="white"/><text x="64" y="92" font-size="46" fill="#142D43" font-weight="700">Image chỉ đọc, container có lớp ghi</text><text x="64" y="139" font-size="25" fill="#455D70" font-weight="400">Merged view là góc nhìn hợp nhất, không phải một bản sao đầy đủ của image.</text><path d="M64 171 L1536 171" stroke="#CBD8E3" stroke-width="2"/><text x="80" y="228" font-size="29" fill="#142D43" font-weight="700">Container dùng image</text><text x="765" y="228" font-size="29" fill="#142D43" font-weight="700">Merged view: cây tệp nhìn thấy</text><rect x="80" y="266" width="570" height="108" rx="10" fill="#E0F3EF" stroke="#71A99E" stroke-width="2"/><text x="104" y="307" font-size="29" fill="#096B60" font-weight="700">Writable container layer</text><text x="104" y="345" font-size="24" fill="#142D43" font-weight="400">Ghi mới / sửa / đánh dấu xóa</text><rect x="80" y="400" width="570" height="72" rx="10" fill="#EAF2FA" stroke="#9BB4CA" stroke-width="2"/><text x="104" y="446" font-size="26" fill="#145EA8" font-weight="600">Image layer: ứng dụng · chỉ đọc</text><rect x="80" y="490" width="570" height="72" rx="10" fill="#EAF2FA" stroke="#9BB4CA" stroke-width="2"/><text x="104" y="536" font-size="26" fill="#145EA8" font-weight="600">Image layers: nền · chỉ đọc</text><path d="M668 416 L741 416" fill="none" stroke="#145EA8" stroke-width="3" marker-end="url(#arrow)"/><rect x="765" y="267" width="390" height="296" rx="10" fill="#F5F8FB" stroke="#B3C6D5" stroke-width="2"/><text x="790" y="315" font-size="26" fill="#142D43" font-weight="400" font-family="Consolas, monospace">/app/start.sh</text><text x="790" y="364" font-size="26" fill="#142D43" font-weight="400" font-family="Consolas, monospace">/etc/config</text><text x="790" y="413" font-size="26" fill="#096B60" font-weight="400" font-family="Consolas, monospace">/tmp/session</text><text x="790" y="510" font-size="23" fill="#455D70" font-weight="400">Gộp lớp ghi + lớp đọc</text><rect x="1200" y="267" width="320" height="296" rx="10" fill="#FFF3DC" stroke="#C9A464" stroke-width="2" stroke-dasharray="8 6"/><text x="1224" y="315" font-size="30" fill="#795016" font-weight="700">Volume</text><text x="1224" y="362" font-size="24" fill="#142D43" font-weight="400">Dữ liệu riêng</text><text x="1224" y="403" font-size="24" fill="#142D43" font-weight="400">ngoài lớp ghi</text><text x="1224" y="510" font-size="24" fill="#795016" font-weight="400">Gắn tại /data</text><path d="M1155 455 L1194 455" fill="none" stroke="#145EA8" stroke-width="3" marker-end="url(#arrow)"/><text x="80" y="632" font-size="27" fill="#142D43" font-weight="600">Mỗi container có lớp ghi riêng; nhiều container có thể dùng chung image.</text><rect x="64" y="706" width="1472" height="96" rx="10" fill="#F0F5F9" stroke="#D2DEE7" stroke-width="2"/><text x="88" y="745" font-size="25" fill="#142D43" font-weight="600">Xóa container → mất lớp ghi; volume không tự mất theo container.</text><text x="88" y="780" font-size="23" fill="#455D70" font-weight="400">Đường dẫn được gắn volume đọc/ghi vào volume, không vào writable layer của container.</text><text x="64" y="847" font-size="19" fill="#455D70" font-weight="400">Nguồn: docs.docker.com/engine/storage/drivers/</text><text x="1458" y="847" font-size="22" fill="#455D70" font-weight="400">2 / 4</text></g></svg></div><figcaption><a href="#diagram-2" data-show="2">Chỉ hiện hình 2</a> · <a href="https://docs.docker.com/engine/storage/drivers/">Storage drivers</a> · <a href="https://docs.docker.com/engine/storage/drivers/overlayfs-driver/">OverlayFS driver</a></figcaption></figure><figure id="diagram-3"><div class="canvas"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title3 desc3"><title id="title3">Copy-up: sao chép trước, rồi mới sửa</title><desc id="desc3">Ví dụ sửa nội dung một tệp đã tồn tại trong image với storage driver overlay2.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#145EA8"/></marker></defs><g font-family="Segoe UI, Arial, sans-serif"><rect width="1600" height="900" fill="white"/><text x="64" y="92" font-size="46" fill="#142D43" font-weight="700">Copy-up: sao chép trước, rồi mới sửa</text><text x="64" y="139" font-size="25" fill="#455D70" font-weight="400">Ví dụ sửa nội dung một tệp đã tồn tại trong image với storage driver overlay2.</text><path d="M64 171 L1536 171" stroke="#CBD8E3" stroke-width="2"/><text x="64" y="235" font-size="30" fill="#142D43" font-weight="700">1. Trước khi sửa</text><text x="64" y="288" font-size="23" fill="#096B60" font-weight="600">upperdir · lớp ghi</text><rect x="64" y="310" width="460" height="140" rx="10" fill="#E0F3EF" stroke="#71A99E" stroke-width="2"/><text x="64" y="500" font-size="23" fill="#145EA8" font-weight="600">lowerdir · image chỉ đọc</text><rect x="64" y="520" width="460" height="120" rx="10" fill="#EAF2FA" stroke="#9BB4CA" stroke-width="2"/><text x="570" y="235" font-size="30" fill="#142D43" font-weight="700">2. Lần ghi đầu</text><text x="570" y="288" font-size="23" fill="#096B60" font-weight="600">upperdir · lớp ghi</text><rect x="570" y="310" width="460" height="140" rx="10" fill="#E0F3EF" stroke="#71A99E" stroke-width="2"/><text x="570" y="500" font-size="23" fill="#145EA8" font-weight="600">lowerdir · image chỉ đọc</text><rect x="570" y="520" width="460" height="120" rx="10" fill="#EAF2FA" stroke="#9BB4CA" stroke-width="2"/><text x="1076" y="235" font-size="30" fill="#142D43" font-weight="700">3. Ghi tiếp</text><text x="1076" y="288" font-size="23" fill="#096B60" font-weight="600">upperdir · lớp ghi</text><rect x="1076" y="310" width="460" height="140" rx="10" fill="#E0F3EF" stroke="#71A99E" stroke-width="2"/><text x="1076" y="500" font-size="23" fill="#145EA8" font-weight="600">lowerdir · image chỉ đọc</text><rect x="1076" y="520" width="460" height="120" rx="10" fill="#EAF2FA" stroke="#9BB4CA" stroke-width="2"/><text x="90" y="365" font-size="26" fill="#455D70" font-weight="400">Chưa có config.txt</text><text x="90" y="564" font-size="25" fill="#145EA8" font-weight="600">config.txt · bản gốc</text><text x="90" y="606" font-size="23" fill="#142D43" font-weight="400">Đọc trực tiếp từ lớp dưới</text><text x="596" y="359" font-size="25" fill="#096B60" font-weight="600">config.txt · bản sửa</text><text x="596" y="409" font-size="23" fill="#142D43" font-weight="400">Sửa trên bản sao</text><text x="596" y="564" font-size="25" fill="#145EA8" font-weight="600">config.txt · bản gốc</text><text x="596" y="606" font-size="23" fill="#142D43" font-weight="400">Không thay đổi</text><path d="M800 519 L800 455" fill="none" stroke="#145EA8" stroke-width="3" marker-end="url(#arrow)"/><text x="829" y="484" font-size="22" fill="#145EA8" font-weight="600">copy-up</text><text x="1102" y="359" font-size="25" fill="#096B60" font-weight="600">config.txt · sửa tiếp</text><text x="1102" y="409" font-size="23" fill="#142D43" font-weight="400">Ghi ngay ở upperdir</text><text x="1102" y="564" font-size="25" fill="#145EA8" font-weight="600">config.txt · bản gốc</text><text x="1102" y="606" font-size="23" fill="#142D43" font-weight="400">Vẫn không thay đổi</text><path d="M528 381 L560 381" fill="none" stroke="#145EA8" stroke-width="3" marker-end="url(#arrow)"/><path d="M1034 381 L1066 381" fill="none" stroke="#145EA8" stroke-width="3" marker-end="url(#arrow)"/><rect x="64" y="706" width="1472" height="96" rx="10" fill="#F0F5F9" stroke="#D2DEE7" stroke-width="2"/><text x="88" y="745" font-size="25" fill="#142D43" font-weight="600">overlay2 copy-up toàn bộ tệp, dù chỉ sửa một phần nội dung.</text><text x="88" y="780" font-size="23" fill="#455D70" font-weight="400">Lần ghi sau dùng bản đã ở upperdir; merged view ưu tiên bản ở lớp trên.</text><text x="64" y="847" font-size="19" fill="#455D70" font-weight="400">Nguồn: docs.docker.com/engine/storage/drivers/overlayfs-driver/</text><text x="1458" y="847" font-size="22" fill="#455D70" font-weight="400">3 / 4</text></g></svg></div><figcaption><a href="#diagram-3" data-show="3">Chỉ hiện hình 3</a> · <a href="https://docs.docker.com/engine/storage/drivers/">Storage drivers</a> · <a href="https://docs.docker.com/engine/storage/drivers/overlayfs-driver/">OverlayFS driver</a></figcaption></figure><figure id="diagram-4"><div class="canvas"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title4 desc4"><title id="title4">Xóa ở lớp sau không làm lớp trước nhỏ lại</title><desc id="desc4">So sánh dữ liệu được giữ lại trong image, không chỉ cây tệp cuối cùng.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#145EA8"/></marker></defs><g font-family="Segoe UI, Arial, sans-serif"><rect width="1600" height="900" fill="white"/><text x="64" y="92" font-size="46" fill="#142D43" font-weight="700">Xóa ở lớp sau không làm lớp trước nhỏ lại</text><text x="64" y="139" font-size="25" fill="#455D70" font-weight="400">So sánh dữ liệu được giữ lại trong image, không chỉ cây tệp cuối cùng.</text><path d="M64 171 L1536 171" stroke="#CBD8E3" stroke-width="2"/><text x="64" y="230" font-size="31" fill="#A42D40" font-weight="700">Xóa ở RUN sau</text><text x="845" y="230" font-size="31" fill="#096B60" font-weight="700">Tạo và xóa trong cùng RUN</text><path d="M800 218 L800 671" stroke="#CBD8E3" stroke-width="2"/><rect x="64" y="259" width="690" height="110" rx="10" fill="#F5F8FB" stroke="#B3C6D5" stroke-width="2"/><text x="86" y="300" font-size="25" fill="#142D43" font-weight="400" font-family="Consolas, monospace">RUN tạo /tmp/cache.bin</text><text x="86" y="341" font-size="25" fill="#142D43" font-weight="400" font-family="Consolas, monospace">RUN rm /tmp/cache.bin</text><rect x="64" y="398" width="690" height="84" rx="10" fill="#FBECEF" stroke="#CB8F99" stroke-width="2"/><text x="88" y="433" font-size="26" fill="#A42D40" font-weight="700">Lớp sau: whiteout / dấu xóa</text><text x="88" y="466" font-size="23" fill="#142D43" font-weight="400">Merged view không còn thấy tệp</text><rect x="64" y="511" width="690" height="84" rx="10" fill="#EAF2FA" stroke="#9BB4CA" stroke-width="2"/><text x="88" y="547" font-size="26" fill="#145EA8" font-weight="700">Lớp trước: cache.bin vẫn còn</text><text x="88" y="580" font-size="23" fill="#142D43" font-weight="400">Dữ liệu cũ vẫn chiếm dung lượng image</text><text x="64" y="650" font-size="27" fill="#A42D40" font-weight="700">Ẩn tệp ≠ thu hồi dữ liệu ở lớp dưới</text><rect x="845" y="259" width="690" height="110" rx="10" fill="#F5F8FB" stroke="#B3C6D5" stroke-width="2"/><text x="867" y="300" font-size="25" fill="#142D43" font-weight="400" font-family="Consolas, monospace">RUN tạo /tmp/cache.bin &amp;&amp;</text><text x="867" y="341" font-size="25" fill="#142D43" font-weight="400" font-family="Consolas, monospace">    rm /tmp/cache.bin</text><rect x="845" y="398" width="690" height="197" rx="10" fill="#E0F3EF" stroke="#71A99E" stroke-width="2"/><text x="869" y="441" font-size="28" fill="#096B60" font-weight="700">Kết thúc RUN: tệp không còn</text><text x="869" y="491" font-size="25" fill="#142D43" font-weight="400">Không lưu nội dung tệp tạm này</text><text x="869" y="529" font-size="25" fill="#142D43" font-weight="400">trong thay đổi cuối của lớp.</text><text x="869" y="572" font-size="23" fill="#455D70" font-weight="400">Điều kiện: tệp được tạo trong RUN này.</text><text x="845" y="650" font-size="27" fill="#096B60" font-weight="700">Dọn tệp tạm trước khi kết thúc RUN</text><rect x="64" y="706" width="1472" height="96" rx="10" fill="#F0F5F9" stroke="#D2DEE7" stroke-width="2"/><text x="88" y="745" font-size="25" fill="#142D43" font-weight="600">Xóa tệp vốn có ở lớp dưới, dù trong cùng RUN, vẫn không xóa dữ liệu lớp dưới.</text><text x="88" y="780" font-size="23" fill="#455D70" font-weight="400">Whiteout chỉ che tệp; ví dụ là mã giả. Không tính kích thước nén hay cache build.</text><text x="64" y="847" font-size="19" fill="#455D70" font-weight="400">Nguồn: Docker Docs · storage/drivers/ và storage/drivers/overlayfs-driver/</text><text x="1458" y="847" font-size="22" fill="#455D70" font-weight="400">4 / 4</text></g></svg></div><figcaption><a href="#diagram-4" data-show="4">Chỉ hiện hình 4</a> · <a href="https://docs.docker.com/engine/storage/drivers/">Storage drivers</a> · <a href="https://docs.docker.com/engine/storage/drivers/overlayfs-driver/">OverlayFS driver</a></figcaption></figure></main><script>function show(n){document.body.classList.add('solo');document.querySelectorAll('figure').forEach((f,i)=>f.classList.toggle('chosen',i===n-1));window.scrollTo(0,0)}document.querySelectorAll('[data-show]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();history.replaceState(null,'','#slide-'+a.dataset.show);show(Number(a.dataset.show))}));function all(){document.body.classList.remove('solo');history.replaceState(null,'',location.pathname)}document.getElementById('all').onclick=all;document.getElementById('print').onclick=()=>window.print();document.addEventListener('keydown',e=>{if(e.key==='Escape')all()});const m=location.hash.match(/^#slide-([1-4])$/);if(m)show(Number(m[1]));</script></body></html>
