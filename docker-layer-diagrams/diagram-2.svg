<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title2 desc2" role="img" viewBox="0 0 1600 900"><title id="title2">Image chỉ đọc, container có lớp ghi</title><desc id="desc2">Merged view là góc nhìn hợp nhất, không phải một bản sao đầy đủ của image.</desc><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#145EA8" d="M0 0 L10 5 L0 10Z"/></marker></defs><g font-family="Segoe UI, Arial, sans-serif"><rect width="1600" height="900" fill="#fff"/><text x="64" y="92" fill="#142D43" font-size="46" font-weight="700">Image chỉ đọc, container có lớp ghi</text><text x="64" y="139" fill="#455D70" font-size="25" font-weight="400">Merged view là góc nhìn hợp nhất, không phải một bản sao đầy đủ của image.</text><path stroke="#CBD8E3" stroke-width="2" d="M64 171 L1536 171"/><text x="80" y="228" fill="#142D43" font-size="29" font-weight="700">Container dùng image</text><text x="765" y="228" fill="#142D43" font-size="29" font-weight="700">Merged view: cây tệp nhìn thấy</text><rect width="570" height="108" x="80" y="266" fill="#E0F3EF" stroke="#71A99E" stroke-width="2" rx="10"/><text x="104" y="307" fill="#096B60" font-size="29" font-weight="700">Writable container layer</text><text x="104" y="345" fill="#142D43" font-size="24" font-weight="400">Ghi mới / sửa / đánh dấu xóa</text><rect width="570" height="72" x="80" y="400" fill="#EAF2FA" stroke="#9BB4CA" stroke-width="2" rx="10"/><text x="104" y="446" fill="#145EA8" font-size="26" font-weight="600">Image layer: ứng dụng · chỉ đọc</text><rect width="570" height="72" x="80" y="490" fill="#EAF2FA" stroke="#9BB4CA" stroke-width="2" rx="10"/><text x="104" y="536" fill="#145EA8" font-size="26" font-weight="600">Image layers: nền · chỉ đọc</text><path fill="none" stroke="#145EA8" stroke-width="3" marker-end="url(#arrow)" d="M668 416 L741 416"/><rect width="390" height="296" x="765" y="267" fill="#F5F8FB" stroke="#B3C6D5" stroke-width="2" rx="10"/><text x="790" y="315" fill="#142D43" font-family="Consolas, monospace" font-size="26" font-weight="400">/app/start.sh</text><text x="790" y="364" fill="#142D43" font-family="Consolas, monospace" font-size="26" font-weight="400">/etc/config</text><text x="790" y="413" fill="#096B60" font-family="Consolas, monospace" font-size="26" font-weight="400">/tmp/session</text><text x="790" y="510" fill="#455D70" font-size="23" font-weight="400">Gộp lớp ghi + lớp đọc</text><rect width="320" height="296" x="1200" y="267" fill="#FFF3DC" stroke="#C9A464" stroke-dasharray="8 6" stroke-width="2" rx="10"/><text x="1224" y="315" fill="#795016" font-size="30" font-weight="700">Volume</text><text x="1224" y="362" fill="#142D43" font-size="24" font-weight="400">Dữ liệu riêng</text><text x="1224" y="403" fill="#142D43" font-size="24" font-weight="400">ngoài lớp ghi</text><text x="1224" y="510" fill="#795016" font-size="24" font-weight="400">Gắn tại /data</text><path fill="none" stroke="#145EA8" stroke-width="3" marker-end="url(#arrow)" d="M1155 455 L1194 455"/><text x="80" y="632" fill="#142D43" font-size="27" font-weight="600">Mỗi container có lớp ghi riêng; nhiều container có thể dùng chung image.</text><rect width="1472" height="96" x="64" y="706" fill="#F0F5F9" stroke="#D2DEE7" stroke-width="2" rx="10"/><text x="88" y="745" fill="#142D43" font-size="25" font-weight="600">Xóa container → mất lớp ghi; volume không tự mất theo container.</text><text x="88" y="780" fill="#455D70" font-size="23" font-weight="400">Đường dẫn được gắn volume đọc/ghi vào volume, không vào writable layer của container.</text><text x="64" y="847" fill="#455D70" font-size="19" font-weight="400">Nguồn: docs.docker.com/engine/storage/drivers/</text><text x="1458" y="847" fill="#455D70" font-size="22" font-weight="400">2 / 4</text></g></svg>