<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title2 desc2"><title id="title2">Image chỉ đọc, container có lớp ghi</title><desc id="desc2">Merged view là góc nhìn hợp nhất, không phải một bản sao đầy đủ của image.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#145EA8"/></marker></defs><g font-family="Segoe UI, Arial, sans-serif"><rect width="1600" height="900" fill="white"/><text x="64" y="92" font-size="46" fill="#142D43" font-weight="700">Image chỉ đọc, container có lớp ghi</text><text x="64" y="139" font-size="25" fill="#455D70" font-weight="400">Merged view là góc nhìn hợp nhất, không phải một bản sao đầy đủ của image.</text><path d="M64 171 L1536 171" stroke="#CBD8E3" stroke-width="2"/><text x="80" y="228" font-size="29" fill="#142D43" font-weight="700">Container dùng image</text><text x="765" y="228" font-size="29" fill="#142D43" font-weight="700">Merged view: cây tệp nhìn thấy</text><rect x="80" y="266" width="570" height="108" rx="10" fill="#E0F3EF" stroke="#71A99E" stroke-width="2"/><text x="104" y="307" font-size="29" fill="#096B60" font-weight="700">Writable container layer</text><text x="104" y="345" font-size="24" fill="#142D43" font-weight="400">Ghi mới / sửa / đánh dấu xóa</text><rect x="80" y="400" width="570" height="72" rx="10" fill="#EAF2FA" stroke="#9BB4CA" stroke-width="2"/><text x="104" y="446" font-size="26" fill="#145EA8" font-weight="600">Image layer: ứng dụng · chỉ đọc</text><rect x="80" y="490" width="570" height="72" rx="10" fill="#EAF2FA" stroke="#9BB4CA" stroke-width="2"/><text x="104" y="536" font-size="26" fill="#145EA8" font-weight="600">Image layers: nền · chỉ đọc</text><path d="M668 416 L741 416" fill="none" stroke="#145EA8" stroke-width="3" marker-end="url(#arrow)"/><rect x="765" y="267" width="390" height="296" rx="10" fill="#F5F8FB" stroke="#B3C6D5" stroke-width="2"/><text x="790" y="315" font-size="26" fill="#142D43" font-weight="400" font-family="Consolas, monospace">/app/start.sh</text><text x="790" y="364" font-size="26" fill="#142D43" font-weight="400" font-family="Consolas, monospace">/etc/config</text><text x="790" y="413" font-size="26" fill="#096B60" font-weight="400" font-family="Consolas, monospace">/tmp/session</text><text x="790" y="510" font-size="23" fill="#455D70" font-weight="400">Gộp lớp ghi + lớp đọc</text><rect x="1200" y="267" width="320" height="296" rx="10" fill="#FFF3DC" stroke="#C9A464" stroke-width="2" stroke-dasharray="8 6"/><text x="1224" y="315" font-size="30" fill="#795016" font-weight="700">Volume</text><text x="1224" y="362" font-size="24" fill="#142D43" font-weight="400">Dữ liệu riêng</text><text x="1224" y="403" font-size="24" fill="#142D43" font-weight="400">ngoài lớp ghi</text><text x="1224" y="510" font-size="24" fill="#795016" font-weight="400">Gắn tại /data</text><path d="M1155 455 L1194 455" fill="none" stroke="#145EA8" stroke-width="3" marker-end="url(#arrow)"/><text x="80" y="632" font-size="27" fill="#142D43" font-weight="600">Mỗi container có lớp ghi riêng; nhiều container có thể dùng chung image.</text><rect x="64" y="706" width="1472" height="96" rx="10" fill="#F0F5F9" stroke="#D2DEE7" stroke-width="2"/><text x="88" y="745" font-size="25" fill="#142D43" font-weight="600">Xóa container → mất lớp ghi; volume không tự mất theo container.</text><text x="88" y="780" font-size="23" fill="#455D70" font-weight="400">Đường dẫn được gắn volume đọc/ghi vào volume, không vào writable layer của container.</text><text x="64" y="847" font-size="19" fill="#455D70" font-weight="400">Nguồn: docs.docker.com/engine/storage/drivers/</text><text x="1458" y="847" font-size="22" fill="#455D70" font-weight="400">2 / 4</text></g></svg>