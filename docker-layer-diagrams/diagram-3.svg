<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title3 desc3"><title id="title3">Copy-up: sao chép trước, rồi mới sửa</title><desc id="desc3">Ví dụ sửa nội dung một tệp đã tồn tại trong image với storage driver overlay2.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#145EA8"/></marker></defs><g font-family="Segoe UI, Arial, sans-serif"><rect width="1600" height="900" fill="white"/><text x="64" y="92" font-size="46" fill="#142D43" font-weight="700">Copy-up: sao chép trước, rồi mới sửa</text><text x="64" y="139" font-size="25" fill="#455D70" font-weight="400">Ví dụ sửa nội dung một tệp đã tồn tại trong image với storage driver overlay2.</text><path d="M64 171 L1536 171" stroke="#CBD8E3" stroke-width="2"/><text x="64" y="235" font-size="30" fill="#142D43" font-weight="700">1. Trước khi sửa</text><text x="64" y="288" font-size="23" fill="#096B60" font-weight="600">upperdir · lớp ghi</text><rect x="64" y="310" width="460" height="140" rx="10" fill="#E0F3EF" stroke="#71A99E" stroke-width="2"/><text x="64" y="500" font-size="23" fill="#145EA8" font-weight="600">lowerdir · image chỉ đọc</text><rect x="64" y="520" width="460" height="120" rx="10" fill="#EAF2FA" stroke="#9BB4CA" stroke-width="2"/><text x="570" y="235" font-size="30" fill="#142D43" font-weight="700">2. Lần ghi đầu</text><text x="570" y="288" font-size="23" fill="#096B60" font-weight="600">upperdir · lớp ghi</text><rect x="570" y="310" width="460" height="140" rx="10" fill="#E0F3EF" stroke="#71A99E" stroke-width="2"/><text x="570" y="500" font-size="23" fill="#145EA8" font-weight="600">lowerdir · image chỉ đọc</text><rect x="570" y="520" width="460" height="120" rx="10" fill="#EAF2FA" stroke="#9BB4CA" stroke-width="2"/><text x="1076" y="235" font-size="30" fill="#142D43" font-weight="700">3. Ghi tiếp</text><text x="1076" y="288" font-size="23" fill="#096B60" font-weight="600">upperdir · lớp ghi</text><rect x="1076" y="310" width="460" height="140" rx="10" fill="#E0F3EF" stroke="#71A99E" stroke-width="2"/><text x="1076" y="500" font-size="23" fill="#145EA8" font-weight="600">lowerdir · image chỉ đọc</text><rect x="1076" y="520" width="460" height="120" rx="10" fill="#EAF2FA" stroke="#9BB4CA" stroke-width="2"/><text x="90" y="365" font-size="26" fill="#455D70" font-weight="400">Chưa có config.txt</text><text x="90" y="564" font-size="25" fill="#145EA8" font-weight="600">config.txt · bản gốc</text><text x="90" y="606" font-size="23" fill="#142D43" font-weight="400">Đọc trực tiếp từ lớp dưới</text><text x="596" y="359" font-size="25" fill="#096B60" font-weight="600">config.txt · bản sửa</text><text x="596" y="409" font-size="23" fill="#142D43" font-weight="400">Sửa trên bản sao</text><text x="596" y="564" font-size="25" fill="#145EA8" font-weight="600">config.txt · bản gốc</text><text x="596" y="606" font-size="23" fill="#142D43" font-weight="400">Không thay đổi</text><path d="M800 519 L800 455" fill="none" stroke="#145EA8" stroke-width="3" marker-end="url(#arrow)"/><text x="829" y="484" font-size="22" fill="#145EA8" font-weight="600">copy-up</text><text x="1102" y="359" font-size="25" fill="#096B60" font-weight="600">config.txt · sửa tiếp</text><text x="1102" y="409" font-size="23" fill="#142D43" font-weight="400">Ghi ngay ở upperdir</text><text x="1102" y="564" font-size="25" fill="#145EA8" font-weight="600">config.txt · bản gốc</text><text x="1102" y="606" font-size="23" fill="#142D43" font-weight="400">Vẫn không thay đổi</text><path d="M528 381 L560 381" fill="none" stroke="#145EA8" stroke-width="3" marker-end="url(#arrow)"/><path d="M1034 381 L1066 381" fill="none" stroke="#145EA8" stroke-width="3" marker-end="url(#arrow)"/><rect x="64" y="706" width="1472" height="96" rx="10" fill="#F0F5F9" stroke="#D2DEE7" stroke-width="2"/><text x="88" y="745" font-size="25" fill="#142D43" font-weight="600">overlay2 copy-up toàn bộ tệp, dù chỉ sửa một phần nội dung.</text><text x="88" y="780" font-size="23" fill="#455D70" font-weight="400">Lần ghi sau dùng bản đã ở upperdir; merged view ưu tiên bản ở lớp trên.</text><text x="64" y="847" font-size="19" fill="#455D70" font-weight="400">Nguồn: docs.docker.com/engine/storage/drivers/overlayfs-driver/</text><text x="1458" y="847" font-size="22" fill="#455D70" font-weight="400">3 / 4</text></g></svg>