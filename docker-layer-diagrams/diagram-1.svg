<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title1 desc1"><title id="title1">Dockerfile tạo nên image layers</title><desc id="desc1">Mô hình giản lược: các thay đổi hệ thống tệp được xếp thành lớp.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#145EA8"/></marker></defs><g font-family="Segoe UI, Arial, sans-serif"><rect width="1600" height="900" fill="white"/><text x="64" y="92" font-size="46" fill="#142D43" font-weight="700">Dockerfile tạo nên image layers</text><text x="64" y="139" font-size="25" fill="#455D70" font-weight="400">Mô hình giản lược: các thay đổi hệ thống tệp được xếp thành lớp.</text><path d="M64 171 L1536 171" stroke="#CBD8E3" stroke-width="2"/><text x="80" y="228" font-size="29" fill="#142D43" font-weight="700">Dockerfile minh họa</text><text x="910" y="228" font-size="29" fill="#142D43" font-weight="700">Image: chồng các lớp chỉ đọc</text><rect x="80" y="260" width="660" height="388" rx="10" fill="#F5F8FB" stroke="#B3C6D5" stroke-width="2"/><text x="108" y="320" font-size="25" fill="#142D43" font-weight="400" font-family="Consolas, monospace">FROM alpine:3.21</text><text x="108" y="390" font-size="25" fill="#142D43" font-weight="400" font-family="Consolas, monospace">COPY app/ /app/</text><text x="108" y="460" font-size="25" fill="#142D43" font-weight="400" font-family="Consolas, monospace">RUN chmod +x /app/start.sh</text><text x="108" y="530" font-size="25" fill="#142D43" font-weight="400" font-family="Consolas, monospace">CMD [&quot;/app/start.sh&quot;]</text><text x="108" y="600" font-size="23" fill="#455D70" font-weight="400">CMD: cấu hình chạy, không thêm lớp tệp</text><rect x="910" y="280" width="610" height="94" rx="10" fill="#EAF2FA" stroke="#9BB4CA" stroke-width="2"/><text x="936" y="317" font-size="28" fill="#145EA8" font-weight="700">Lớp mới: RUN</text><text x="936" y="352" font-size="23" fill="#142D43" font-weight="400">Đổi quyền /app/start.sh</text><rect x="910" y="390" width="610" height="94" rx="10" fill="#EAF2FA" stroke="#9BB4CA" stroke-width="2"/><text x="936" y="427" font-size="28" fill="#145EA8" font-weight="700">Lớp mới: COPY</text><text x="936" y="462" font-size="23" fill="#142D43" font-weight="400">Thêm nội dung /app/</text><rect x="910" y="500" width="610" height="94" rx="10" fill="#EAF2FA" stroke="#9BB4CA" stroke-width="2"/><text x="936" y="537" font-size="28" fill="#145EA8" font-weight="700">Các lớp từ base image</text><text x="936" y="572" font-size="23" fill="#142D43" font-weight="400">FROM tham chiếu image nền</text><path d="M755 406 L887 406" fill="none" stroke="#145EA8" stroke-width="3" marker-end="url(#arrow)"/><text x="775" y="382" font-size="23" fill="#145EA8" font-weight="600">build</text><text x="930" y="634" font-size="24" fill="#455D70" font-weight="400">Đọc chồng từ dưới lên</text><rect x="64" y="706" width="1472" height="96" rx="10" fill="#F0F5F9" stroke="#D2DEE7" stroke-width="2"/><text x="88" y="745" font-size="25" fill="#142D43" font-weight="600">RUN, COPY, ADD có thể tạo thay đổi hệ thống tệp.</text><text x="88" y="780" font-size="23" fill="#455D70" font-weight="400">Không phải mọi lệnh Dockerfile đều tạo filesystem layer; FROM dùng các lớp có sẵn.</text><text x="64" y="847" font-size="19" fill="#455D70" font-weight="400">Nguồn: docs.docker.com/engine/storage/drivers/</text><text x="1458" y="847" font-size="22" fill="#455D70" font-weight="400">1 / 4</text></g></svg>